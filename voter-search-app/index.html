<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#c2185b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="मतदाता खोज">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<title>मतदाता खोज</title>
<style>
  :root {
    --bg: #f3f4f6; --card: #fff; --ink: #111; --muted: #6b7280; --line: #d1d5db;
    --pink: #e0245e; --pink-dark: #c2185b; --accent: #1f4e8c; --bad: #b91c1c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans Devanagari", "Kohinoor Devanagari", "Mangal", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  body > section { flex: 1 0 auto; }
  button, input, select { font: inherit; }
  .hidden { display: none !important; }

  /* lock screen */
  #lock, #home { display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .lockbox { width: 100%; max-width: 380px; background: var(--card); border-radius: 14px; padding: 24px 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08); text-align: center; }
  .lockbox img { width: 72px; height: 72px; border-radius: 16px; }
  .lockbox h1 { font-size: 22px; margin: 12px 0 2px; }
  .lockbox p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .lockbox input[type=password], .lockbox input[type=text] { width: 100%; padding: 12px 14px; font-size: 18px;
    border: 1.5px solid var(--line); border-radius: 10px; text-align: center; letter-spacing: 1px; }
  .lockbox label { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 12px 0; font-size: 14px; color: var(--muted); }
  .btn { width: 100%; padding: 12px; font-size: 18px; border: 0; border-radius: 10px; background: var(--pink-dark); color: #fff; font-weight: 600; }
  .btn:disabled { opacity: .6; }
  #lockMsg { min-height: 22px; margin-top: 10px; font-size: 14px; color: var(--bad); line-height: 1.5; }
  #lockMsg.info { color: var(--muted); }
  #lock.loading form, #lock.loading #lockSub { display: none; }
  #lockMsg a { color: var(--accent); font-weight: 600; }
  .villages { display: grid; gap: 8px; margin-top: 4px; }
  .villages a { display: block; padding: 12px; border: 1.5px solid var(--line); border-radius: 10px; color: var(--ink);
    text-decoration: none; font-size: 18px; font-weight: 600; }
  .homebar { display: flex; justify-content: flex-end; gap: 6px; margin: -10px -6px 6px; }
  .homebar a, .homebar button { border-radius: 8px; padding: 5px 12px; font-size: 14px; text-decoration: none; }
  #homeAdmin { background: var(--accent); color: #fff; font-weight: 600; }
  #homeOut { border: 1px solid var(--line); background: #fff; color: var(--muted); }
  .villages a small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }

  /* search screen */
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
    padding: calc(8px + env(safe-area-inset-top)) 12px 8px; }
  .titlebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .titlebar b { font-size: 17px; }
  .titlebar .who { font-size: 12px; color: var(--muted); font-weight: 400; display: block; }
  .titlebar button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 10px; font-size: 13px; color: var(--muted); flex: none; }
  .tb-actions { display: flex; gap: 6px; flex: none; }
  #switchBtn { display: inline-block; margin-left: 8px; vertical-align: 2px; border: 1px solid var(--line); background: #fff; border-radius: 8px;
    padding: 1px 8px; font-size: 12.5px; color: var(--accent); text-decoration: none; font-weight: 600; white-space: nowrap; }
  @media (max-width: 480px) { .titlebar .appname { display: none; } }   /* phones: village name and its button on one line */
  #adminBtn { border-radius: 8px; padding: 4px 10px; font-size: 13px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  .fields { display: grid; gap: 6px; }
  .fields input, .fields select { width: 100%; padding: 10px 12px; font-size: 17px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; }
  .fields input:focus, .fields select:focus { outline: none; border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
  .row2 select { width: auto; }
  #count { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 18px; }
  #count.bad { color: var(--bad); }
  main { padding: 10px 10px 24px; max-width: 640px; margin: 0 auto; }
  .hint { color: var(--muted); font-size: 14px; line-height: 1.6; padding: 8px 6px; }

  /* voter slip, modelled on the printed slip */
  .slip { background: var(--card); border: 1.5px solid #222; margin: 0 0 12px; font-size: 15px; }
  .slip .head { display: grid; grid-template-columns: 1fr auto; align-items: end; padding: 6px 8px 0; }
  .slip .meta { font-size: 12.5px; text-align: right; line-height: 1.5; white-space: nowrap; }
  .slip .meta span + span { margin-left: 12px; }
  .slip .idline { display: flex; align-items: center; gap: 10px; padding: 2px 8px 4px; }
  .slip .boxno { min-width: 46px; padding: 0 6px; border: 1.5px solid #222; text-align: center; font-weight: 700;
    font-family: "Times New Roman", Georgia, serif; font-size: 20px; line-height: 28px; }
  .slip .epic { font-size: 22px; font-weight: 700; font-family: Arial, Helvetica, sans-serif; letter-spacing: .3px; word-break: break-all; }
  .slip .epic.none { font-size: 13px; font-weight: 400; color: var(--muted); }
  .slip .line { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline; padding: 3px 8px; }
  .slip .line .k { font-weight: 600; }
  .slip .line b { font-size: 17px; }
  .slip .line .r { text-align: right; white-space: nowrap; }
  .slip .line .r b { margin-left: 4px; }
  .slip .line .r .g { margin-left: 10px; }
  .slip .en { font-size: 12px; color: var(--muted); margin-left: 4px; font-weight: 400; }
  .slip .kendra { border-top: 1px solid #222; margin: 6px 6px 0; padding: 4px 4px 3px; font-size: 13px; text-align: center; }
  .slip .time { background: var(--pink); color: #fff; text-align: center; font-size: 13px; padding: 3px 4px; }
  #more { margin: 4px auto 0; display: block; width: auto; padding: 10px 22px; font-size: 16px; }
  #qMark { font-size: 15px; padding: 8px 10px; }
  #bigBtn { font-weight: 700; color: var(--ink); }
  #bigBtn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .slip .tools { display: flex; flex-wrap: wrap; gap: 6px; justify-self: start; align-self: start; }
  .slip .tools .fam { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 3px 9px; font-size: 13px; color: var(--ink); font-weight: 600; }
  .slip .tools .fam.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .family { margin: -4px 0 14px 10px; padding: 8px 0 0 10px; border-left: 3px solid var(--accent); }
  .family .fh { font-size: 13.5px; font-weight: 600; color: var(--accent); margin: 0 0 8px; }
  .family .slip:last-child { margin-bottom: 0; }
  .slip .bar small { font-weight: 400; font-size: 12px; margin-left: 8px; opacity: .9; }
  /* bigger text (अ+ button), remembered on this phone */
  html.big .slip, html.big .family .fh, html.big .hint { zoom: 1.2; }
  html.big .fields input, html.big .fields select { font-size: 20px; }
  html.big #count { font-size: 15px; }
  .pbtn { justify-self: start; align-self: start; border: 1px solid var(--line); background: #fff; border-radius: 8px;
    padding: 3px 9px; font-size: 13px; color: var(--accent); font-weight: 600; }

  /* marks set by an admin, seen by everyone */
  .slip .bar { display: none; color: #fff; font-weight: 700; font-size: 14px; padding: 4px 8px; }
  .slip[data-mark] .bar { display: block; }
  .slip[data-mark=done] { border-color: #16a34a; }   .slip[data-mark=done] .bar { background: #16a34a; }
  .slip[data-mark=coming] { border-color: #ca8a04; } .slip[data-mark=coming] .bar { background: #facc15; color: #422006; }
  .slip[data-mark=absent] { border-color: #dc2626; } .slip[data-mark=absent] .bar { background: #dc2626; }
  .marks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; border-top: 1px dashed var(--line); background: #fafafa; }
  .marks button { padding: 6px 4px; font-size: 14px; border-radius: 8px; background: #fff; font-weight: 600; }
  .marks .done { border: 1.5px solid #16a34a; color: #15803d; }  .marks .done.on { background: #16a34a; color: #fff; }
  .marks .coming { border: 1.5px solid #ca8a04; color: #854d0e; } .marks .coming.on { background: #facc15; color: #422006; }
  .marks .absent { border: 1.5px solid #dc2626; color: #dc2626; } .marks .absent.on { background: #dc2626; color: #fff; }
  .countrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  #wardPrint { border: 0; border-radius: 8px; padding: 5px 10px; margin-top: 6px; font-size: 13px; background: var(--accent); color: #fff; font-weight: 600; }

  /* footer: who made the app and how to reach them */
  .footer { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 18px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--card);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; color: var(--muted); }
  .footer a { color: inherit; text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
  .footer .by { display: inline-flex; align-items: center; gap: 6px; }
  .footer .by img { width: 22px; height: 22px; border-radius: 6px; }
  .footer .by b { color: #12473f; font-size: 14px; }

  /* printing / saving as PDF: only the slips in #printArea, each 94 mm wide, from the top-left corner of the page */
  #printArea { display: none; }
  @media print {
    @page { size: A4; margin: 8mm; }
    html, body { background: #fff; }
    body > section, .footer { display: none !important; }
    #printArea { display: block; font-size: 0; }
    #printArea .slip { display: inline-block; vertical-align: top; width: 94mm; margin: 0 2mm 2mm 0; font-size: 13px;
      break-inside: avoid; page-break-inside: avoid; }
    #printArea .slip .epic { font-size: 19px; }
    #printArea .slip .line b { font-size: 15px; }
    #printArea .slip .kendra { font-size: 11px; }
    #printArea .slip .time { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<section id="lock" class="loading">
  <div class="lockbox">
    <img src="/icon-192.png" alt="">
    <h1>मतदाता खोज</h1>
    <p id="lockSub"></p>
    <form id="lockForm" autocomplete="off">
      <input id="pw" type="password" placeholder="पासवर्ड डालें" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <label><input id="showPw" type="checkbox"> पासवर्ड दिखाएं</label>
      <label><input id="remember" type="checkbox" checked> इस फ़ोन पर याद रखें</label>
      <button class="btn" id="unlockBtn" type="submit">खोलें</button>
    </form>
    <div id="lockMsg" class="info">खुल रहा है…</div>
  </div>
</section>

<section id="home" class="hidden">
  <div class="lockbox">
    <div class="homebar"><a id="homeAdmin" class="hidden" href="/admin">एडमिन</a><button id="homeOut" type="button">लॉग आउट</button></div>
    <img src="/icon-192.png" alt="">
    <h1>मतदाता खोज</h1>
    <p id="homeMsg">अपना गाँव चुनें</p>
    <div class="villages" id="villages"></div>
  </div>
</section>

<section id="app" class="hidden">
  <header>
    <div class="titlebar"><b><span class="appname">मतदाता खोज · </span><span id="vName"></span><a id="switchBtn" class="hidden" href="/">गाँव बदलें</a><span class="who" id="who"></span></b>
      <span class="tb-actions"><button id="bigBtn" type="button" aria-label="बड़े अक्षर" aria-pressed="false">अ+</button><a id="adminBtn" class="hidden" href="">एडमिन</a><button id="lockBtn" type="button">लॉग आउट</button></span></div>
    <div class="fields">
      <input id="qName" type="search" placeholder="नाम / Name / बॉक्स नं. / Voter ID" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <div class="row2">
        <input id="qRel" type="search" placeholder="पिता / पति का नाम" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <select id="qWard" aria-label="वार्ड"><option value="">सभी वार्ड</option></select>
      </div>
      <select id="qMark" class="hidden" aria-label="निशान से छाँटें">
        <option value="">सभी मतदाता (निशान कोई भी)</option>
        <option value="none">सिर्फ़ बिना निशान वाले</option>
        <option value="done">सिर्फ़ ✓ पूरा हुआ</option>
        <option value="coming">सिर्फ़ आ रहे हैं</option>
        <option value="absent">सिर्फ़ उपलब्ध नहीं</option>
      </select>
    </div>
    <div class="countrow"><div id="count"></div><button id="wardPrint" class="hidden" type="button"></button></div>
  </header>
  <main>
    <div id="results"></div>
    <button class="btn hidden" id="more" type="button">और दिखाएं</button>
  </main>
</section>

<footer class="footer">
  <a class="by" href="https://digyai.com" target="_blank" rel="noopener">Powered by <img src="/digyai-logo.png" alt=""> <b>DigyAi</b></a>
  <a href="mailto:contact@digyai.com">contact@digyai.com</a>
  <a href="https://wa.me/917888924374" target="_blank" rel="noopener">WhatsApp +91 7888924374</a>
  <span>Mon–Sat, 10:00–19:00 IST</span>
</footer>

<div id="printArea"></div>

<script>
'use strict';
// The village comes from the address: raj-voter.vercel.app/<village>. Its details (name, पंचायत समिति / जिला परिषद
// निर्वाचन क्षेत्र, polling time, wards) come from the server in VILLAGE once the page opens.
const SLUG = decodeURIComponent(location.pathname.split('/')[1] || '').toLowerCase().replace(/\.html$/, '').replace(/^index$/, '');
// On the start page (no village, or an unknown one) you log in first, then see the villages your password opens.
let HOME = !SLUG;
let VILLAGE = null;
const $ = (id) => document.getElementById(id);
const store = {  // localStorage can be blocked (private mode); then the user just logs in each time
  get(k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v, keep) { try { (keep ? localStorage : sessionStorage).setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} },
};
// this app is online-only: remove any offline cache an older version may have installed
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {});
if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});

// A person's login is kept per village; an admin's login (superadmin or village admin) is shared by all village pages.
let tokKey = `tok:${SLUG}`;
const token = () => { tokKey = store.get(`tok:${SLUG}`) ? `tok:${SLUG}` : 'tok:admin'; return store.get(tokKey); };

const MSG = {
  wrong: 'पासवर्ड गलत है',
  retired: 'यह पासवर्ड बंद कर दिया गया है — एडमिन से नया पासवर्ड लें',
  login: 'दोबारा लॉगिन करें',
  logged_out: 'आपको लॉग आउट कर दिया गया है — दोबारा लॉगिन करें',
  other_device: 'यह पासवर्ड किसी दूसरे फ़ोन पर खोला गया है, इसलिए यहाँ से लॉग आउट हो गया। एक पासवर्ड एक समय पर एक ही फ़ोन पर चलता है।',
  too_many: 'बहुत बार गलत पासवर्ड — 15 मिनट बाद कोशिश करें',
  slow_down: 'बहुत तेज़ खोज — एक मिनट रुककर कोशिश करें',
  offline: 'इंटरनेट नहीं है — इंटरनेट चालू करें',
  server: 'सर्वर में दिक्कत — थोड़ी देर बाद कोशिश करें',
  no_village: 'यह गाँव नहीं मिला — पता (लिंक) जाँचें',
  other_village: 'यह पासवर्ड इस गाँव का नहीं है',
  not_admin: 'यह काम सिर्फ़ एडमिन कर सकते हैं',
  not_found: 'यह मतदाता नहीं मिला',
  no_mark: 'निशान लगाने की अनुमति नहीं है — एडमिन से पूछें',
  no_pdf: 'पूरे वार्ड की पर्चियों की अनुमति नहीं है — एडमिन से पूछें',
  no_ward_list: 'पूरा वार्ड देखने की अनुमति नहीं है — नाम लिखकर खोजें',
};
const SESSION_ERRORS = ['retired', 'login', 'logged_out', 'other_device', 'other_village'];
// What this login may do besides searching by name (admins: everything); the server checks these on every request.
let IS_ADMIN = false, PERMS = [];
const can = (p) => IS_ADMIN || PERMS.includes(p);
async function api(path, payload) {
  let r;
  try {
    r = await fetch(`/api/${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ village: SLUG, ...payload }) });
  } catch (e) { return { error: 'offline' }; }
  try { return await r.json(); } catch (e) { return { error: 'server' }; }
}

// ---------- login ----------
function showLock(msg, info) {
  $('app').classList.add('hidden'); $('home').classList.add('hidden'); $('lock').classList.remove('hidden', 'loading');
  $('lockMsg').textContent = msg || ''; $('lockMsg').classList.toggle('info', !!info);
}
// while checking a saved login: the same card without the password form
function showLoading(msg) {
  showLock(msg, true);
  $('lock').classList.add('loading');
}
function signOut(msg) {
  if (msg === MSG.other_village) return showLock(msg);   // keep an admin's login for their own villages
  store.del(tokKey);
  $('results').innerHTML = ''; $('qName').value = ''; $('qRel').value = ''; $('qMark').value = ''; $('count').textContent = '';
  showLock(msg);
}
function showApp(name, admin, villages, perms) {
  PERMS = perms || [];
  $('who').textContent = name ? `उपयोगकर्ता: ${name}` : '';
  $('adminBtn').classList.toggle('hidden', !admin);
  $('switchBtn').classList.toggle('hidden', !(villages && villages.length > 1));   // only for logins with several villages
  IS_ADMIN = !!admin; wardButton();
  $('lock').classList.add('hidden'); $('app').classList.remove('hidden');
  search();
}

$('showPw').addEventListener('change', (e) => { $('pw').type = e.target.checked ? 'text' : 'password'; });
$('lockForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = $('pw').value.trim();
  if (!password) return;
  $('unlockBtn').disabled = true; showLock('खुल रहा है…', true);
  const r = await api('unlock', HOME ? { password, village: '', home: true } : { password });
  $('unlockBtn').disabled = false;
  if (r.error === 'other_village' && r.village) return otherVillage(r);
  if (r.error) return showLock(MSG[r.error] || MSG.server);
  const keep = $('remember').checked;
  tokKey = r.admin ? 'tok:admin' : `tok:${HOME ? r.villages[0] : SLUG}`;
  store.set(tokKey, r.token, keep);
  $('pw').value = '';
  if (HOME) { store.set('villages', JSON.stringify(r.list), keep); return myVillages(r.list); }
  showApp(r.name, r.admin, r.villages, r.perms);
});
$('lockBtn').addEventListener('click', () => {
  api('logout', { token: token() });   // close the session on the server; no need to wait
  signOut('');
});

// ---------- search ----------
let seq = 0, shown = 0, total = 0, lastBox = 0;
function hint() {
  $('results').innerHTML = '<div class="hint">नाम या पिता/पति का नाम हिंदी या English में लिखें।<br>' +
    'गलत स्पेलिंग भी चलेगी, जैसे <b>bhanvarlal</b>, <b>mangi lal</b>, <b>मांगीलाल</b>।<br>' +
    'बॉक्स नंबर (जैसे <b>25</b>, वार्ड चुनकर, या <b>3/25</b> = वार्ड 3 का बॉक्स 25) या Voter ID (जैसे <b>XHE1102649</b>) से भी खोज सकते हैं।' +
    (can('ward') ? '<br>सिर्फ़ वार्ड चुनें तो उस वार्ड के सभी मतदाता बॉक्स नंबर के क्रम में दिखेंगे।' : '') + '</div>';
}
const FILTER = { none: 'बिना निशान वाले', done: '✓ पूरा हुआ', coming: 'आ रहे हैं', absent: 'उपलब्ध नहीं' };
async function search(more = false) {
  const q = { name: $('qName').value.trim(), rel: $('qRel').value.trim(), ward: $('qWard').value, mark: $('qMark').value };
  const named = !!(q.name || q.rel);
  $('count').classList.remove('bad');
  wardButton();
  $('qMark').classList.toggle('hidden', !q.ward);   // filter by mark once a ward is chosen
  if (!q.ward) q.mark = '';
  if (!named && !q.ward) { ++seq; hint(); $('count').textContent = ''; $('more').classList.add('hidden'); return; }   // ++seq: drop a search still on its way
  if (!named && !can('ward')) { ++seq; $('results').innerHTML = '';
    $('count').textContent = MSG.no_ward_list; $('more').classList.add('hidden'); return; }
  const mine = ++seq;
  if (!more) $('count').textContent = 'खोज रहे हैं…';
  // a whole ward pages on from the last box shown, so slips marked meanwhile don't shift the list
  const r = await api('search', { ...q, offset: more ? shown : 0, after: more ? lastBox : 0, token: token() });
  if (mine !== seq) return;                       // a newer search has started
  if (SESSION_ERRORS.includes(r.error)) return signOut(MSG[r.error]);
  if (r.error) { $('count').textContent = MSG[r.error] || MSG.server; $('count').classList.add('bad'); return; }
  if (r.perms) updatePerms(r.perms);
  total = r.total;
  if (!more) { $('results').innerHTML = ''; shown = 0; }
  const frag = document.createDocumentFragment();
  for (const v of r.results) frag.appendChild(slip(v));
  $('results').appendChild(frag);
  shown += r.results.length;
  if (r.results.length) lastBox = r.results[r.results.length - 1].box;
  const which = q.mark ? `${FILTER[q.mark]} ` : '';
  const found = named ? `${total} ${which}मतदाता मिले` : `वार्ड ${q.ward} · ${q.mark ? which : 'सभी '}${total} मतदाता, बॉक्स क्रम में`;
  $('count').textContent = total ? found + (total > shown ? ` · ${shown} दिखाए` : '')
    : q.mark ? `वार्ड ${q.ward} में ${which}कोई मतदाता नहीं` : 'कोई मतदाता नहीं मिला — स्पेलिंग बदलकर देखें';
  $('more').classList.toggle('hidden', !r.more);
}
// the admin can change what this person may do at any time; the next answer from the server says so
function updatePerms(p) {
  if (IS_ADMIN || p.join() === PERMS.join()) return;
  PERMS = p;
  wardButton();
  if (shown) search();   // redraw the slips with the right buttons
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function kv(label, value) { const f = document.createDocumentFragment(); f.append(label, el('b', null, value)); return f; }

const MARKS = { done: '✓ पूरा हुआ', coming: 'आ रहे हैं', absent: 'उपलब्ध नहीं' };

// One slip. forPrint leaves out the buttons and the mark; inFamily leaves out the परिवार button.
function slip(r, forPrint, inFamily) {
  const [bhag, ...rest] = String(r.kendra || '').split('-');
  const d = el('div', 'slip');
  if (!forPrint) d.dataset.key = `${r.ward}:${r.box}`;
  const head = el('div', 'head');
  const tools = el('div', 'tools');
  if (!forPrint && can('print')) {
    const pb = el('button', 'pbtn', 'प्रिंट / PDF'); pb.type = 'button';
    pb.addEventListener('click', () => printSlips([r], `पर्ची ${VILLAGE.name} वार्ड ${r.ward} बॉक्स ${r.box}`));
    tools.append(pb);
  }
  if (!forPrint && !inFamily && String(r.house || '').trim()) {
    const fb = el('button', 'fam', 'परिवार'); fb.type = 'button';
    fb.addEventListener('click', () => toggleFamily(r, d, fb));
    tools.append(fb);
  }
  head.append(tools);
  const meta = el('div', 'meta');
  const m1 = el('div'); m1.append(el('span', null, `पं.सं. ${VILLAGE.ps}`), el('span', null, `जि.प. ${VILLAGE.zp}`));
  const m2 = el('div'); m2.append(el('span', null, `वार्ड नं. : ${r.ward}`), el('span', null, `भाग सं. ${bhag.trim()}`));
  meta.append(m1, m2); head.append(meta);

  const idl = el('div', 'idline');
  idl.append(el('div', 'boxno', r.box), r.epic ? el('div', 'epic', r.epic) : el('div', 'epic none', 'Voter ID नहीं'));

  const l1 = el('div', 'line');
  const n = el('div'); n.append(el('span', 'k', 'नाम: '), el('b', null, r.hname), el('span', 'en', r.name));
  const h = el('div', 'r'); h.append(kv('मकान संख्या:', r.house || '—'));
  l1.append(n, h);

  const l2 = el('div', 'line');
  const p = el('div'); p.append(el('span', 'k', `${r.rel} का नाम: `), el('b', null, r.hrel), el('span', 'en', r.relname));
  const ag = el('div', 'r'); ag.append(kv('आयु:', r.age)); const g = el('span', 'g'); g.append(kv('लिंग:', r.sex)); ag.append(g);
  l2.append(p, ag);

  const k = el('div', 'kendra'); k.append('मतदान केन्द्र : ', el('b', null, bhag.trim()), ` - ${rest.join('-').trim()}`);
  d.append(head, idl, l1, l2, k, el('div', 'time', VILLAGE.pollTime));
  if (forPrint) return d;

  d.prepend(el('div', 'bar'));
  if (can('mark')) {   // admins, and users their admin allowed to mark; everyone sees the bar
    const row = el('div', 'marks');
    for (const m of Object.keys(MARKS)) {
      const b = el('button', m, MARKS[m].replace('✓ ', '')); b.type = 'button'; b.dataset.m = m;
      b.addEventListener('click', () => setMark(r, d, m));
      row.append(b);
    }
    d.append(row);
  }
  d.dataset.by = r.markBy || ''; d.dataset.at = r.markAt || '';
  showMark(d, r.mark, r.markBy, r.markAt);
  return d;
}

// everyone else at the same house number in the ward, opened under the slip
async function toggleFamily(r, d, btn) {
  const open = d.nextElementSibling && d.nextElementSibling.classList.contains('family') ? d.nextElementSibling : null;
  if (open) { open.remove(); btn.classList.remove('on'); btn.textContent = 'परिवार'; return; }
  btn.disabled = true; btn.textContent = 'ला रहे हैं…';
  const x = await api('search', { family: `${r.ward}:${r.box}`, token: token() });
  btn.disabled = false; btn.textContent = 'परिवार';
  if (SESSION_ERRORS.includes(x.error)) return signOut(MSG[x.error]);
  if (x.error) { alert(MSG[x.error] || MSG.server); return; }
  const others = x.results.filter((v) => v.box !== r.box);
  const box = el('div', 'family');
  box.append(el('div', 'fh', others.length ? `मकान नं. ${r.house} · वार्ड ${r.ward} · इसी मकान के और ${others.length} मतदाता`
    : `मकान नं. ${r.house} पर और कोई मतदाता नहीं`));
  for (const v of others) box.append(slip(v, false, true));
  d.after(box);
  btn.classList.add('on'); btn.textContent = 'परिवार छुपाएं';
}

// ---------- status marks (set by admins and people allowed to; everyone sees the bar, who set it and when) ----------
const when = (iso) => new Date(iso).toLocaleString('hi-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
function showMark(d, m, by, at) {
  if (MARKS[m]) d.dataset.mark = m; else delete d.dataset.mark;
  const bar = d.querySelector('.bar');
  bar.textContent = MARKS[m] || '';
  if (MARKS[m] && (by || at)) bar.append(el('small', null, [by, at && when(at)].filter(Boolean).join(', ')));
  d.querySelectorAll('.marks button').forEach((b) => b.classList.toggle('on', b.dataset.m === m));
}
async function setMark(r, d, m) {
  const before = [d.dataset.mark || '', d.dataset.by || '', d.dataset.at || ''];
  const mark = before[0] === m ? '' : m;         // tapping the lit button again removes the mark
  showMark(d, mark);                             // show it at once; undo if the server refuses
  const x = await api('mark', { token: token(), ward: r.ward, box: r.box, mark });
  if (SESSION_ERRORS.includes(x.error)) return signOut(MSG[x.error]);
  if (x.error) { showMark(d, ...before); alert(MSG[x.error] || MSG.server); return; }
  r.mark = mark; d.dataset.by = x.by; d.dataset.at = x.at;
  showMark(d, mark, x.by, x.at);
}
// marks set on another phone reach this one without a new search: every minute, and when the app comes back on screen
async function refreshMarks() {
  const slips = [...document.querySelectorAll('#results .slip[data-key]')];   // family slips included
  if (!slips.length || document.hidden || !VILLAGE || $('app').classList.contains('hidden')) return;
  const x = await api('marks', { token: token(), keys: slips.map((d) => d.dataset.key) });
  if (SESSION_ERRORS.includes(x.error)) return signOut(MSG[x.error]);
  if (!x.marks) return;
  for (const d of slips) {
    const k = x.marks[d.dataset.key];
    if (!k) continue;
    d.dataset.by = k.by; d.dataset.at = k.at;
    showMark(d, k.m, k.by, k.at);
  }
  if (x.perms) updatePerms(x.perms);
}
setInterval(refreshMarks, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshMarks(); });

// ---------- printing / saving slips as PDF (the phone's print screen also offers "Save as PDF") ----------
function printSlips(rows, title) {
  const area = $('printArea'); area.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (const r of rows) frag.append(slip(r, true));
  area.append(frag);
  const old = document.title;
  document.title = title;                 // becomes the suggested PDF file name
  window.addEventListener('afterprint', () => { document.title = old; area.innerHTML = ''; }, { once: true });
  window.print();
}
function wardButton() {
  const w = $('qWard').value;
  $('wardPrint').classList.toggle('hidden', !can('wardPdf') || !w);
  $('wardPrint').textContent = `वार्ड ${w} की सभी पर्चियाँ · प्रिंट / PDF`;
}
$('wardPrint').addEventListener('click', async () => {
  const w = $('qWard').value, btn = $('wardPrint');
  if (!w) return;
  btn.disabled = true; btn.textContent = 'पर्चियाँ आ रही हैं…';
  const r = await api('search', { token: token(), ward: w, all: true });
  btn.disabled = false; wardButton();
  if (SESSION_ERRORS.includes(r.error)) return signOut(MSG[r.error]);
  if (r.error) { $('count').textContent = MSG[r.error] || MSG.server; $('count').classList.add('bad'); return; }
  printSlips(r.results, `पर्चियाँ ${VILLAGE.name} वार्ड ${w} (${r.total})`);
});

let timer;
for (const id of ['qName', 'qRel']) $(id).addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => search(), 300); });
$('qWard').addEventListener('change', () => search());
$('qMark').addEventListener('change', () => search());
$('more').addEventListener('click', () => search(true));

// bigger text, remembered on this phone
function setBig(on) {
  document.documentElement.classList.toggle('big', on);
  $('bigBtn').classList.toggle('on', on); $('bigBtn').setAttribute('aria-pressed', on);
  store.set('big', on ? '1' : '', true);
}
setBig(store.get('big') === '1');
$('bigBtn').addEventListener('click', () => setBig(!document.documentElement.classList.contains('big')));

// ---------- start page: after login, the villages this password opens (just one → open it straight away) ----------
function myVillages(list) {
  if (list.length === 1) return location.replace(`/${list[0].slug}`);
  $('lock').classList.add('hidden'); $('app').classList.add('hidden'); $('home').classList.remove('hidden');
  $('homeAdmin').classList.toggle('hidden', savedLogin() !== 'tok:admin');   // superadmin and village admins
  $('homeMsg').textContent = list.length ? 'अपना गाँव चुनें' : 'इस पासवर्ड से कोई गाँव नहीं खुलता — एडमिन से पूछें';
  const box = $('villages'); box.innerHTML = '';
  for (const v of list) {
    const a = el('a', null, v.name); a.href = `/${v.slug}`; a.append(el('small', null, v.title));
    const where = [v.panchayatSamiti && `पंचायत समिति ${v.panchayatSamiti}`, v.district && `ज़िला ${v.district}`].filter(Boolean).join(' · ');
    if (where) a.append(el('small', null, where));
    box.append(a);
  }
}
// the login kept on this phone: an admin's, or a person's (kept under their village)
function savedLogin() {
  if (store.get('tok:admin')) return 'tok:admin';
  try {
    for (const s of [localStorage, sessionStorage]) for (let i = 0; i < s.length; i++) if (/^tok:/.test(s.key(i))) return s.key(i);
  } catch (e) {}
  return null;
}
function homeLock(msg, info) {
  $('home').classList.add('hidden');
  $('lockSub').textContent = 'अपना पासवर्ड डालें';
  showLock(msg, info);
}
$('homeOut').addEventListener('click', () => {
  const k = savedLogin();
  if (k) { api('logout', { token: store.get(k) }); store.del(k); }
  store.del('villages');
  homeLock('');
});
// a password of another village: point to that village's page
function otherVillage(r) {
  showLock(`यह पासवर्ड ${r.villageName || r.village} का है। `);
  const a = el('a', null, `${r.villageName || r.village} की खोज खोलें →`); a.href = `/${r.village}`;
  $('lockMsg').append(a);
}
function setVillage(v) {
  VILLAGE = v;
  document.title = `मतदाता खोज · ${v.name}`;
  $('lockSub').textContent = `${v.title} · वार्ड ${v.wards.length > 1 ? `${v.wards[0]}–${v.wards[v.wards.length - 1]}` : v.wards[0]}`;
  $('vName').textContent = v.name;
  $('adminBtn').href = `/${v.slug}/admin`;
  for (const w of v.wards) $('qWard').add(new Option(`वार्ड ${w}`, w));
  const m = document.createElement('link'); m.rel = 'manifest'; m.href = `/${v.slug}/manifest.webmanifest`;
  document.head.append(m);
}

// ---------- open straight in if this phone is remembered, after checking the password is still active ----------
async function openVillage(v) {
  setVillage(v);
  const tok = token();
  if (!tok) return showLock('');
  showLoading('जाँच रहे हैं…');
  const r = await api('check', { token: tok });
  if (r.error) return showLock(MSG[r.error] || MSG.server);
  if (!r.active) return signOut(MSG[r.reason] || MSG.login);
  showApp(r.name, r.admin, r.villages, r.perms);
}

(async () => {
  if (SLUG) {
    showLoading('खुल रहा है…');
    const info = await api('info', {});
    if (!info.error) return openVillage(info.village);
    if (info.error !== 'no_village') return showLock(MSG[info.error] || MSG.server);
    HOME = true; history.replaceState(null, '', '/');   // unknown village address: go to the start page
  }
  // start page: log in first, then the villages of this login
  const k = savedLogin();
  if (!k) return homeLock(SLUG ? MSG.no_village : '');
  // show the villages saved at the last login straight away (a village page checks the login itself),
  // and check the login meanwhile
  let saved = null;
  try { saved = JSON.parse(store.get('villages')); } catch (e) {}
  if (Array.isArray(saved) && saved.length) myVillages(saved);
  else showLoading('जाँच रहे हैं…');
  if (saved && saved.length === 1) return;
  const r = await api('check', { village: '', token: store.get(k) });
  if (r.error) return saved ? undefined : homeLock(MSG[r.error] || MSG.server);   // offline: keep the saved list
  if (!r.active) { store.del(k); store.del('villages'); return homeLock(MSG[r.reason] || MSG.login); }
  let keep = false; try { keep = !!localStorage.getItem(k); } catch (e) {}
  store.set('villages', JSON.stringify(r.list), keep);
  myVillages(r.list);
})();
</script>
