<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#c2185b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="मतदाता खोज">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<title>मतदाता खोज</title>
<style>
  :root {
    --bg: #f3f4f6; --card: #fff; --ink: #111; --muted: #6b7280; --line: #d1d5db;
    --pink: #e0245e; --pink-dark: #c2185b; --accent: #1f4e8c; --bad: #b91c1c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans Devanagari", "Kohinoor Devanagari", "Mangal", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: env(safe-area-inset-bottom); }
  button, input, select { font: inherit; }
  .hidden { display: none !important; }

  /* lock screen */
  #lock, #home { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .lockbox { width: 100%; max-width: 380px; background: var(--card); border-radius: 14px; padding: 24px 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08); text-align: center; }
  .lockbox img { width: 72px; height: 72px; border-radius: 16px; }
  .lockbox h1 { font-size: 22px; margin: 12px 0 2px; }
  .lockbox p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .lockbox input[type=password], .lockbox input[type=text] { width: 100%; padding: 12px 14px; font-size: 18px;
    border: 1.5px solid var(--line); border-radius: 10px; text-align: center; letter-spacing: 1px; }
  .lockbox label { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 12px 0; font-size: 14px; color: var(--muted); }
  .btn { width: 100%; padding: 12px; font-size: 18px; border: 0; border-radius: 10px; background: var(--pink-dark); color: #fff; font-weight: 600; }
  .btn:disabled { opacity: .6; }
  #lockMsg { min-height: 22px; margin-top: 10px; font-size: 14px; color: var(--bad); line-height: 1.5; }
  #lockMsg.info { color: var(--muted); }
  #lockMsg a { color: var(--accent); font-weight: 600; }
  .villages { display: grid; gap: 8px; margin-top: 4px; }
  .villages a { display: block; padding: 12px; border: 1.5px solid var(--line); border-radius: 10px; color: var(--ink);
    text-decoration: none; font-size: 18px; font-weight: 600; }
  .villages a small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }

  /* search screen */
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
    padding: calc(8px + env(safe-area-inset-top)) 12px 8px; }
  .titlebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .titlebar b { font-size: 17px; }
  .titlebar .who { font-size: 12px; color: var(--muted); font-weight: 400; display: block; }
  .titlebar button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 10px; font-size: 13px; color: var(--muted); flex: none; }
  .tb-actions { display: flex; gap: 6px; flex: none; }
  #adminBtn { border-radius: 8px; padding: 4px 10px; font-size: 13px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  .fields { display: grid; gap: 6px; }
  .fields input, .fields select { width: 100%; padding: 10px 12px; font-size: 17px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; }
  .fields input:focus, .fields select:focus { outline: none; border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
  .row2 select { width: auto; }
  #count { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 18px; }
  #count.bad { color: var(--bad); }
  main { padding: 10px 10px 24px; max-width: 640px; margin: 0 auto; }
  .hint { color: var(--muted); font-size: 14px; line-height: 1.6; padding: 8px 6px; }

  /* voter slip, modelled on the printed slip */
  .slip { background: var(--card); border: 1.5px solid #222; margin: 0 0 12px; font-size: 15px; }
  .slip .head { display: grid; grid-template-columns: 1fr auto; align-items: end; padding: 6px 8px 0; }
  .slip .meta { font-size: 12.5px; text-align: right; line-height: 1.5; white-space: nowrap; }
  .slip .meta span + span { margin-left: 12px; }
  .slip .idline { display: flex; align-items: center; gap: 10px; padding: 2px 8px 4px; }
  .slip .boxno { min-width: 46px; padding: 0 6px; border: 1.5px solid #222; text-align: center; font-weight: 700;
    font-family: "Times New Roman", Georgia, serif; font-size: 20px; line-height: 28px; }
  .slip .epic { font-size: 22px; font-weight: 700; font-family: Arial, Helvetica, sans-serif; letter-spacing: .3px; word-break: break-all; }
  .slip .epic.none { font-size: 13px; font-weight: 400; color: var(--muted); }
  .slip .line { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline; padding: 3px 8px; }
  .slip .line .k { font-weight: 600; }
  .slip .line b { font-size: 17px; }
  .slip .line .r { text-align: right; white-space: nowrap; }
  .slip .line .r b { margin-left: 4px; }
  .slip .line .r .g { margin-left: 10px; }
  .slip .en { font-size: 12px; color: var(--muted); margin-left: 4px; font-weight: 400; }
  .slip .kendra { border-top: 1px solid #222; margin: 6px 6px 0; padding: 4px 4px 3px; font-size: 13px; text-align: center; }
  .slip .time { background: var(--pink); color: #fff; text-align: center; font-size: 13px; padding: 3px 4px; }
  #more { margin: 4px auto 0; display: block; width: auto; padding: 10px 22px; font-size: 16px; }
</style>
</head>
<body>

<section id="lock">
  <div class="lockbox">
    <img src="/icon-192.png" alt="">
    <h1>मतदाता खोज</h1>
    <p id="lockSub"></p>
    <form id="lockForm" autocomplete="off">
      <input id="pw" type="password" placeholder="पासवर्ड डालें" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <label><input id="showPw" type="checkbox"> पासवर्ड दिखाएं</label>
      <label><input id="remember" type="checkbox" checked> इस फ़ोन पर याद रखें</label>
      <button class="btn" id="unlockBtn" type="submit">खोलें</button>
    </form>
    <div id="lockMsg"></div>
  </div>
</section>

<section id="home" class="hidden">
  <div class="lockbox">
    <img src="/icon-192.png" alt="">
    <h1>मतदाता खोज</h1>
    <p id="homeMsg">अपना गाँव चुनें</p>
    <div class="villages" id="villages"></div>
  </div>
</section>

<section id="app" class="hidden">
  <header>
    <div class="titlebar"><b>मतदाता खोज · <span id="vName"></span><span class="who" id="who"></span></b>
      <span class="tb-actions"><a id="adminBtn" class="hidden" href="">एडमिन</a><button id="lockBtn" type="button">लॉग आउट</button></span></div>
    <div class="fields">
      <input id="qName" type="search" placeholder="नाम / Name / बॉक्स नं. / Voter ID" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <div class="row2">
        <input id="qRel" type="search" placeholder="पिता / पति का नाम" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <select id="qWard" aria-label="वार्ड"><option value="">सभी वार्ड</option></select>
      </div>
    </div>
    <div id="count"></div>
  </header>
  <main>
    <div id="results"></div>
    <button class="btn hidden" id="more" type="button">और दिखाएं</button>
  </main>
</section>

<script>
'use strict';
// The village comes from the address: raj-voter.vercel.app/<village>. Its details (name, पंचायत समिति / जिला परिषद
// निर्वाचन क्षेत्र, polling time, wards) come from the server in VILLAGE once the page opens.
const SLUG = decodeURIComponent(location.pathname.split('/')[1] || '').toLowerCase().replace(/\.html$/, '').replace(/^index$/, '');
let VILLAGE = null;
const $ = (id) => document.getElementById(id);
const store = {  // localStorage can be blocked (private mode); then the user just logs in each time
  get(k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v, keep) { try { (keep ? localStorage : sessionStorage).setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} },
};
// this app is online-only: remove any offline cache an older version may have installed
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {});
if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});

// A person's login is kept per village; an admin's login (superadmin or village admin) is shared by all village pages.
let tokKey = `tok:${SLUG}`;
const token = () => { tokKey = store.get(`tok:${SLUG}`) ? `tok:${SLUG}` : 'tok:admin'; return store.get(tokKey); };

const MSG = {
  wrong: 'पासवर्ड गलत है',
  retired: 'यह पासवर्ड बंद कर दिया गया है — एडमिन से नया पासवर्ड लें',
  login: 'दोबारा लॉगिन करें',
  logged_out: 'आपको लॉग आउट कर दिया गया है — दोबारा लॉगिन करें',
  other_device: 'यह पासवर्ड किसी दूसरे फ़ोन पर खोला गया है, इसलिए यहाँ से लॉग आउट हो गया। एक पासवर्ड एक समय पर एक ही फ़ोन पर चलता है।',
  too_many: 'बहुत बार गलत पासवर्ड — 15 मिनट बाद कोशिश करें',
  slow_down: 'बहुत तेज़ खोज — एक मिनट रुककर कोशिश करें',
  offline: 'इंटरनेट नहीं है — इंटरनेट चालू करें',
  server: 'सर्वर में दिक्कत — थोड़ी देर बाद कोशिश करें',
  no_village: 'यह गाँव नहीं मिला — पता (लिंक) जाँचें',
  other_village: 'यह पासवर्ड इस गाँव का नहीं है',
};
async function api(path, payload) {
  let r;
  try {
    r = await fetch(`/api/${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ village: SLUG, ...payload }) });
  } catch (e) { return { error: 'offline' }; }
  try { return await r.json(); } catch (e) { return { error: 'server' }; }
}

// ---------- login ----------
function showLock(msg, info) {
  $('app').classList.add('hidden'); $('lock').classList.remove('hidden');
  $('lockMsg').textContent = msg || ''; $('lockMsg').classList.toggle('info', !!info);
}
function signOut(msg) {
  if (msg === MSG.other_village) return showLock(msg);   // keep an admin's login for their own villages
  store.del(tokKey);
  $('results').innerHTML = ''; $('qName').value = ''; $('qRel').value = ''; $('count').textContent = '';
  showLock(msg);
}
function showApp(name, admin) {
  $('who').textContent = name ? `उपयोगकर्ता: ${name}` : '';
  $('adminBtn').classList.toggle('hidden', !admin);
  $('lock').classList.add('hidden'); $('app').classList.remove('hidden');
  search();
}

$('showPw').addEventListener('change', (e) => { $('pw').type = e.target.checked ? 'text' : 'password'; });
$('lockForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = $('pw').value.trim();
  if (!password) return;
  $('unlockBtn').disabled = true; showLock('खुल रहा है…', true);
  const r = await api('unlock', { password });
  $('unlockBtn').disabled = false;
  if (r.error === 'other_village' && r.village) return otherVillage(r);
  if (r.error) return showLock(MSG[r.error] || MSG.server);
  const keep = $('remember').checked;
  tokKey = r.admin ? 'tok:admin' : `tok:${SLUG}`;
  store.set(tokKey, r.token, keep);
  $('pw').value = '';
  showApp(r.name, r.admin);
});
$('lockBtn').addEventListener('click', () => {
  api('logout', { token: token() });   // close the session on the server; no need to wait
  signOut('');
});

// ---------- search ----------
let seq = 0, shown = 0, total = 0, last = null;
function hint() {
  $('results').innerHTML = '<div class="hint">नाम या पिता/पति का नाम हिंदी या English में लिखें।<br>' +
    'गलत स्पेलिंग भी चलेगी, जैसे <b>bhanvarlal</b>, <b>mangi lal</b>, <b>मांगीलाल</b>।<br>' +
    'बॉक्स नंबर (जैसे <b>25</b>, वार्ड चुनकर) या Voter ID (जैसे <b>XHE1102649</b>) से भी खोज सकते हैं।</div>';
}
async function search(offset = 0) {
  const q = { name: $('qName').value.trim(), rel: $('qRel').value.trim(), ward: $('qWard').value };
  $('count').classList.remove('bad');
  if (!q.name && !q.rel) { hint(); $('count').textContent = ''; $('more').classList.add('hidden'); return; }
  const mine = ++seq;
  if (!offset) $('count').textContent = 'खोज रहे हैं…';
  const r = await api('search', { ...q, offset, token: token() });
  if (mine !== seq) return;                       // a newer search has started
  if (['retired', 'login', 'logged_out', 'other_device', 'other_village'].includes(r.error)) return signOut(MSG[r.error]);
  if (r.error) { $('count').textContent = MSG[r.error] || MSG.server; $('count').classList.add('bad'); return; }
  last = q; total = r.total;
  if (!offset) { $('results').innerHTML = ''; shown = 0; }
  const frag = document.createDocumentFragment();
  for (const v of r.results) frag.appendChild(slip(v));
  $('results').appendChild(frag);
  shown = r.offset + r.results.length;
  $('count').textContent = total ? `${total} मतदाता मिले` + (total > shown ? ` · ${shown} दिखाए` : '') : 'कोई मतदाता नहीं मिला — स्पेलिंग बदलकर देखें';
  $('more').classList.toggle('hidden', !(shown < total && shown <= 200));   // server pages up to 250 results
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function kv(label, value) { const f = document.createDocumentFragment(); f.append(label, el('b', null, value)); return f; }

function slip(r) {
  const [bhag, ...rest] = String(r.kendra || '').split('-');
  const d = el('div', 'slip');
  const head = el('div', 'head');
  head.append(el('div'));
  const meta = el('div', 'meta');
  const m1 = el('div'); m1.append(el('span', null, `पं.सं. ${VILLAGE.ps}`), el('span', null, `जि.प. ${VILLAGE.zp}`));
  const m2 = el('div'); m2.append(el('span', null, `वार्ड नं. : ${r.ward}`), el('span', null, `भाग सं. ${bhag.trim()}`));
  meta.append(m1, m2); head.append(meta);

  const idl = el('div', 'idline');
  idl.append(el('div', 'boxno', r.box), r.epic ? el('div', 'epic', r.epic) : el('div', 'epic none', 'Voter ID नहीं'));

  const l1 = el('div', 'line');
  const n = el('div'); n.append(el('span', 'k', 'नाम: '), el('b', null, r.hname), el('span', 'en', r.name));
  const h = el('div', 'r'); h.append(kv('मकान संख्या:', r.house || '—'));
  l1.append(n, h);

  const l2 = el('div', 'line');
  const p = el('div'); p.append(el('span', 'k', `${r.rel} का नाम: `), el('b', null, r.hrel), el('span', 'en', r.relname));
  const ag = el('div', 'r'); ag.append(kv('आयु:', r.age)); const g = el('span', 'g'); g.append(kv('लिंग:', r.sex)); ag.append(g);
  l2.append(p, ag);

  const k = el('div', 'kendra'); k.append('मतदान केन्द्र : ', el('b', null, bhag.trim()), ` - ${rest.join('-').trim()}`);
  d.append(head, idl, l1, l2, k, el('div', 'time', VILLAGE.pollTime));
  return d;
}

let timer;
for (const id of ['qName', 'qRel']) $(id).addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => search(0), 300); });
$('qWard').addEventListener('change', () => search(0));
$('more').addEventListener('click', () => search(shown));

// ---------- village list (start page, or a wrong village address) ----------
function showHome(list, msg) {
  $('lock').classList.add('hidden'); $('app').classList.add('hidden'); $('home').classList.remove('hidden');
  if (msg) $('homeMsg').textContent = msg;
  const box = $('villages'); box.innerHTML = '';
  for (const v of list || []) {
    const a = el('a', null, v.name); a.href = `/${v.slug}`; a.append(el('small', null, v.title));
    box.append(a);
  }
}
// a password of another village: point to that village's page
function otherVillage(r) {
  showLock(`यह पासवर्ड ${r.villageName || r.village} का है। `);
  const a = el('a', null, `${r.villageName || r.village} की खोज खोलें →`); a.href = `/${r.village}`;
  $('lockMsg').append(a);
}
function setVillage(v) {
  VILLAGE = v;
  document.title = `मतदाता खोज · ${v.name}`;
  $('lockSub').textContent = `${v.title} · वार्ड ${v.wards.length > 1 ? `${v.wards[0]}–${v.wards[v.wards.length - 1]}` : v.wards[0]}`;
  $('vName').textContent = v.name;
  $('adminBtn').href = `/${v.slug}/admin`;
  for (const w of v.wards) $('qWard').add(new Option(`वार्ड ${w}`, w));
  const m = document.createElement('link'); m.rel = 'manifest'; m.href = `/${v.slug}/manifest.webmanifest`;
  document.head.append(m);
}

// ---------- open straight into search if this phone is remembered, after checking the password is still active ----------
(async () => {
  if (!SLUG) {
    const r = await api('info', { village: '' });
    return r.error ? showHome([], MSG[r.error] || MSG.server) : showHome(r.villages);
  }
  showLock('खुल रहा है…', true);
  const info = await api('info', {});
  if (info.error === 'no_village') return showHome(info.villages, MSG.no_village);
  if (info.error) return showLock(MSG[info.error] || MSG.server);
  setVillage(info.village);
  const tok = token();
  if (!tok) return showLock('');
  showLock('जाँच रहे हैं…', true);
  const r = await api('check', { token: tok });
  if (r.error) return showLock(MSG[r.error] || MSG.server);
  if (!r.active) return signOut(MSG[r.reason] || MSG.login);
  showApp(r.name, r.admin);
})();
</script>
</body>
</html>
